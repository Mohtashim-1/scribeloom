# Runs the OpenEdit collaboration server on ws://localhost:1234.
#
#   docker compose up
#
# Documents are kept in the "collab-data" volume (SQLite).
services:
  collab:
    build:
      context: .
      dockerfile: apps/collab-server/Dockerfile
    ports:
      - "${COLLAB_PORT:-1234}:1234"
    environment:
      # Shared secret clients must send as `collab.token`. Empty means no auth:
      # fine on your own machine, not on a network you do not control.
      COLLAB_TOKEN: ${COLLAB_TOKEN:-}
      # Set to store documents in PostgreSQL instead of the SQLite volume.
      DATABASE_URL: ${DATABASE_URL:-}
    volumes:
      - collab-data:/data
    restart: unless-stopped

volumes:
  collab-data:
